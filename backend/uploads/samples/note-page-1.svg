<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img" aria-label="Sample note page one">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e8edf4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="1600" fill="#fbfaf7"/>
  <rect width="1200" height="1600" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="150" fill="#0f4c46"/>
  <circle cx="88" cy="75" r="30" fill="#f2b544"/>
  <path d="M78 61h20a6 6 0 0 1 6 6v26l-16-7-16 7V67a6 6 0 0 1 6-6z" fill="#0f4c46"/>
  <text x="140" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#ffffff">Introduction &amp; Key Definitions</text>
  <text x="140" y="106" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#a8d5cb" letter-spacing="1">OPENNOTE · LECTURE SERIES · PAGE 1</text>

  <text x="90" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c26b2c" letter-spacing="3">DATA STRUCTURES</text>
  <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#16221f">Arrays, lists &amp; the cost of access</text>
  <rect x="90" y="330" width="150" height="5" rx="2" fill="#f2b544"/>

  <text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#33403c">A data structure is a way of arranging data in memory so that</text>
  <text x="90" y="438" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#33403c">operations on it stay predictable — and fast.</text>

  <rect x="90" y="490" width="1020" height="190" rx="14" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
  <text x="120" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#0f4c46">Definition</text>
  <text x="120" y="586" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#3c4a46">An array stores elements in contiguous memory. Access by index is</text>
  <text x="120" y="622" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#3c4a46">O(1); inserting at the front is O(n) because everything shifts.</text>
  <text x="120" y="658" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#3c4a46">A linked list trades that access speed for cheap insertions.</text>

  <text x="90" y="750" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c26b2c" letter-spacing="3">COMPLEXITY AT A GLANCE</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#33403c">
    <rect x="90" y="780" width="1020" height="300" rx="12" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
    <rect x="90" y="780" width="1020" height="54" rx="12" fill="#0f4c46"/>
    <rect x="90" y="820" width="1020" height="14" fill="#0f4c46"/>
    <text x="120" y="815" fill="#ffffff" font-weight="bold">Operation</text>
    <text x="450" y="815" fill="#ffffff" font-weight="bold">Array</text>
    <text x="720" y="815" fill="#ffffff" font-weight="bold">Linked list</text>
    <text x="960" y="815" fill="#ffffff" font-weight="bold">Hash table</text>
    <text x="120" y="880">Access by index</text><text x="450" y="880">O(1)</text><text x="720" y="880">O(n)</text><text x="960" y="880">O(1)</text>
    <text x="120" y="932">Search</text><text x="450" y="932">O(n)</text><text x="720" y="932">O(n)</text><text x="960" y="932">O(1)*</text>
    <text x="120" y="984">Insert at head</text><text x="450" y="984">O(n)</text><text x="720" y="984">O(1)</text><text x="960" y="984">O(1)*</text>
    <text x="120" y="1036">Memory layout</text><text x="450" y="1036">Contiguous</text><text x="720" y="1036">Scattered</text><text x="960" y="1036">Buckets</text>
  </g>

  <text x="90" y="1140" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c26b2c" letter-spacing="3">A SMALL WORKED EXAMPLE</text>
  <text x="90" y="1190" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#16221f">Reversing a singly linked list in one pass</text>

  <rect x="90" y="1220" width="1020" height="230" rx="12" fill="#10201d"/>
  <g font-family="'Courier New', monospace" font-size="22" fill="#b8e6d8">
    <text x="120" y="1270">prev = null</text>
    <text x="120" y="1310">while (node != null) {</text>
    <text x="150" y="1350">next = node.next</text>
    <text x="150" y="1390">node.next = prev</text>
    <text x="150" y="1430">prev = node; node = next</text>
    <text x="120" y="1466">}</text>
  </g>
  <text x="620" y="1350" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7fb5a8">// O(n) time, O(1) extra space</text>

  <rect x="90" y="1510" width="1020" height="2" fill="#dfe7e4"/>
  <text x="90" y="1552" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#85938f">Shared on OpenNote · Sample preview · CSC 301</text>
  <text x="1110" y="1552" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#85938f">1 / 3</text>
</svg>
