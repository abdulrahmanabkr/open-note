services:
  mysql:
    image: mysql:8.4
    container_name: opennote-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: opennote_root
      MYSQL_DATABASE: opennote
      MYSQL_USER: opennote
      MYSQL_PASSWORD: opennote
    ports:
      - "3306:3306"
    volumes:
      - opennote_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-popennote_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  opennote_mysql:
